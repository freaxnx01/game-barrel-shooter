<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Football Flight</title>
<style>
  body { background:#1a1611; color:#f5efe4; font-family: monospace; padding: 16px; }
  pre { white-space: pre-wrap; }
  .pass { color: #6dd96d; }
  .fail { color: #e0483a; }
  .info { color: #c9a13a; }
</style>
</head>
<body>
<!-- American football acceptance harness (#45), on the real crashcat backend:
     spiral flight with the nose along the velocity, irregular bounces, mass,
     and how many barrels of the pyramid one hit knocks over.
     The per-frame flight rule mirrors the game loop in index.html.
     Title becomes FOOTBALL PASS/FAIL. -->
<pre id="out">running…</pre>
<script type="module">
import { createCrashcatBackend } from '../../physics/backend-crashcat.js';
import { createBarrelSupport } from '../../targets/barrel-support.js';
import { FOOTBALL, footballLaunch, longAxis, noseAngle, flightAngularVelocity } from '../../weapons/football.js';

const DT = 1 / 60;
const SHAPE = { kind: 'spheroid', halfLength: FOOTBALL.halfLength, radius: FOOTBALL.radius };
const out = document.getElementById('out');
const lines = [];
let allPass = true;

function row(name, pass, detail) {
  if (!pass) allPass = false;
  lines.push(`<span class="${pass ? 'pass' : 'fail'}">[${pass ? 'PASS' : 'FAIL'}] ${name}: ${detail}</span>`);
}
function info(name, detail) { lines.push(`<span class="info">[INFO] ${name}: ${detail}</span>`); }

const norm = (v) => { const l = Math.hypot(v.x, v.y, v.z); return { x: v.x / l, y: v.y / l, z: v.z / l }; };
const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
const deg = (r) => r * 180 / Math.PI;

function addGround(phys) {
  return phys.addBody({ shape: { kind: 'ground' }, mass: 0, material: 'ground', position: { x: 0, y: 0, z: 0 }, isStatic: true });
}

// Same body and per-frame rule as shootBall / the ball loop in index.html.
function launch(phys, start, dir, power) {
  const l = footballLaunch(dir, power);
  const body = phys.addBody({ shape: SHAPE, mass: FOOTBALL.mass, material: 'ball', position: { ...start }, quaternion: l.quaternion });
  phys.setVelocity(body, l.velocity.x, l.velocity.y, l.velocity.z);
  phys.setAngularVelocity(body, l.angularVelocity.x, l.angularVelocity.y, l.angularVelocity.z);
  const rec = { body, hit: false };
  phys.onCollide(body, () => { rec.hit = true; });
  return rec;
}
function steer(phys, rec) {
  if (rec.hit) return;
  const w = flightAngularVelocity(longAxis(rec.body.quaternion), phys.getAngularVelocity(rec.body), phys.getVelocity(rec.body));
  phys.setAngularVelocity(rec.body, w.x, w.y, w.z);
}

async function withWorld(cc, run) {
  const phys = createCrashcatBackend(cc);
  try { return await run(phys); } finally { phys.destroy(); }
}

// ---- flight: nose within 25° of the velocity, spinning about the long axis ----
function flight(phys, power, aimUp) {
  addGround(phys);
  const dir = norm({ x: 0.15, y: aimUp, z: -1 });
  const rec = launch(phys, { x: 0, y: 6, z: 9 }, dir, power);
  let maxNose = 0, spinSum = 0, n = 0, t = 0;
  while (!rec.hit && t < 4) {
    steer(phys, rec);
    phys.step(DT);
    t += DT;
    if (rec.hit) break;
    const a = longAxis(rec.body.quaternion);
    maxNose = Math.max(maxNose, noseAngle(a, phys.getVelocity(rec.body)));
    spinSum += Math.abs(dot(phys.getAngularVelocity(rec.body), a)); n++;
  }
  return { maxNose, revs: spinSum / n / (2 * Math.PI), t };
}

// ---- bounce: 10 identical drops, only the tilt differs ----
// Each drop lands like a pass coming down: dropped from 2 m with 3 m/s forward (-z), spinning about
// its long axis, the long axis pitched by the tilt in the vertical plane of the flight.
// The heading of the hop is read 0.15 s after the first touch. A sphere with the same drops is the control.
const TILTS = [-65, -50, -35, -20, -5, 10, 25, 40, 55, 70];
function dropOnce(phys, tiltDeg, shape, drop) {
  addGround(phys);
  const t = tiltDeg * Math.PI / 180;
  const axis = { x: 0, y: Math.sin(t), z: -Math.cos(t) };   // nose forward, pitched up by the tilt
  const body = phys.addBody({ shape, mass: FOOTBALL.mass, material: 'ball', position: { x: 0, y: drop.height, z: 0 },
    quaternion: footballLaunch(axis, 0).quaternion });
  const s = FOOTBALL.spinRate;
  phys.setVelocity(body, 0, 0, -drop.forward);
  phys.setAngularVelocity(body, axis.x * s, axis.y * s, axis.z * s);
  let contact = false;
  phys.onCollide(body, () => { contact = true; });
  let time = 0;
  while (!contact && time < 3) { phys.step(DT); time += DT; }
  for (let i = 0; i < 9; i++) phys.step(DT);
  const v = phys.getVelocity(body);
  return deg(Math.atan2(v.x, -v.z));
}
async function dropSpread(cc, shape, drop) {
  const headings = [];
  for (const tilt of TILTS) headings.push(await withWorld(cc, (phys) => dropOnce(phys, tilt, shape, drop)));
  return { spread: spreadOf(headings), headings };
}
function spreadOf(headings) {
  // smallest arc that holds every heading
  const hs = headings.map((h) => (h + 360) % 360).sort((a, b) => a - b);
  let maxGap = hs[0] + 360 - hs[hs.length - 1];
  for (let i = 1; i < hs.length; i++) maxGap = Math.max(maxGap, hs[i] - hs[i - 1]);
  return 360 - maxGap;
}

// ---- barrels: the oil-barrel pyramid of setupBarrels, with the support check ----
const BARREL_R = 0.45, BARREL_H = 1.1, platH = 0.5;
function buildPyramid(phys) {
  addGround(phys);
  phys.addBody({ shape: { kind: 'box', halfExtents: [4, platH / 2, 1.5] }, mass: 0, material: 'ground', position: { x: 0, y: platH / 2, z: -6 }, isStatic: true });
  const barrels = [];
  const baseY = platH + BARREL_H / 2 + 0.01, gap = BARREL_R * 2.3;
  [6, 5, 4, 3, 2, 1].forEach((count, rowIdx) => {
    const y = baseY + rowIdx * (BARREL_H + 0.02);
    const x0 = -((count - 1) * gap) / 2;
    for (let i = 0; i < count; i++) {
      const x = x0 + i * gap;
      const body = phys.addBody({ shape: { kind: 'cylinder', radiusTop: BARREL_R * 1.05, radiusBottom: BARREL_R * 1.05, height: BARREL_H, segments: 12 },
        mass: 8, material: 'barrel', position: { x, y, z: -6 }, startAsleep: true });
      barrels.push({ row: rowIdx, body, home: { x, y, z: -6 }, homeQ: { x: 0, y: 0, z: 0, w: 1 }, down: false });
    }
  });
  return barrels;
}
function markDown(barrels) {   // the knocked-over rule of the game loop
  for (const b of barrels) {
    if (b.down) continue;
    const q = b.body.quaternion;
    const qd = Math.abs(q.x * b.homeQ.x + q.y * b.homeQ.y + q.z * b.homeQ.z + q.w * b.homeQ.w);
    const moved = Math.hypot(b.body.position.x - b.home.x, b.body.position.y - b.home.y, b.body.position.z - b.home.z) > 0.45;
    if (qd < 0.93 || moved) b.down = true;
  }
}
// camera of the barrels target: orbit target (0, 2.8, -6), radius 15.5, phi 0.24
const CAM = { x: 0, y: 2.8 + 15.5 * Math.sin(0.24), z: -6 + 15.5 * Math.cos(0.24) };
function shootPyramid(phys, aim, power) {
  const barrels = buildPyramid(phys);
  const sup = createBarrelSupport({ phys, floors: [0, platH] });
  let tMs = 0;
  for (let i = 0; i < 60; i++) { phys.step(DT); sup.tick(tMs, barrels); tMs += 1000 * DT; }
  const dir = norm({ x: aim.x - CAM.x, y: aim.y - CAM.y, z: aim.z - CAM.z });
  const start = { x: CAM.x + dir.x * 1.2, y: CAM.y + dir.y * 1.2, z: CAM.z + dir.z * 1.2 };
  const rec = launch(phys, start, dir, power);
  let hitRow = -1;
  phys.onCollide(rec.body, (other) => {
    rec.hit = true;
    const b = barrels.find((x) => x.body === other);
    if (b && hitRow < 0) hitRow = b.row;
  });
  for (let i = 0; i < 300; i++) {        // 5 s
    steer(phys, rec);
    phys.step(DT);
    sup.tick(tMs, barrels); tMs += 1000 * DT;
    markDown(barrels);
  }
  return { down: barrels.filter((b) => b.down).length, hitRow };
}

async function main() {
  const cc = await import('https://esm.sh/crashcat@0.0.5');

  const flights = [];
  for (const [power, up] of [[0, 0.12], [0.5, 0.05], [1, 0.02], [0.3, 0.3]]) {
    flights.push({ power, up, ...(await withWorld(cc, (phys) => flight(phys, power, up))) });
  }
  const worst = Math.max(...flights.map((f) => f.maxNose));
  row('noseFollowsVelocity', worst < 25,
    flights.map((f) => `p${f.power}/up${f.up}: max ${f.maxNose.toFixed(1)}° over ${f.t.toFixed(2)} s`).join(', ') + ' (limit 25°)');
  const minRevs = Math.min(...flights.map((f) => f.revs));
  row('spinsAboutLongAxis', minRevs >= 2, flights.map((f) => `${f.revs.toFixed(2)}`).join(' / ') + ' rev/s about the long axis (min 2)');

  const DROP = { height: 2, forward: 3 }, SKID = { height: 1.5, forward: 6 };
  const SPHERE = { kind: 'sphere', radius: FOOTBALL.radius };
  const drop = await dropSpread(cc, SHAPE, DROP);
  row('bounceSpread', drop.spread > 60, `${drop.spread.toFixed(1)}° over ${TILTS.length} drops (limit > 60°): ` +
    TILTS.map((t, i) => `${t}°→${drop.headings[i].toFixed(0)}°`).join(' '));
  info('sphereControl', `same drops with a sphere: ${(await dropSpread(cc, SPHERE, DROP)).spread.toFixed(1)}°`);
  const skid = await dropSpread(cc, SHAPE, SKID);
  info('shallowLanding', `from 1.5 m at 6 m/s forward (a flatter landing) the spread is ${skid.spread.toFixed(1)}°, sphere ${(await dropSpread(cc, SPHERE, SKID)).spread.toFixed(1)}°`);

  const m = await withWorld(cc, (phys) => {
    const b = phys.addBody({ shape: SHAPE, mass: FOOTBALL.mass, material: 'ball', position: { x: 0, y: 50, z: 0 } });
    phys.applyImpulse(b, 1, 0, 0);
    return 1 / phys.getVelocity(b).x;
  });
  row('mass', Math.abs(m - 0.4) <= 0.05, `${m.toFixed(3)} kg from impulse/Δv (0.4 ± 0.05)`);

  // Full power at one barrel of each row; the ball drops ~0.5 m on the way, so aim a little high.
  const shots = [];
  for (const [rowIdx, x] of [[1, 0.5], [2, 0], [3, 0.5], [4, 0], [5, 0]]) {
    const aim = { x, y: platH + BARREL_H / 2 + rowIdx * (BARREL_H + 0.02) + 0.4, z: -6 };
    shots.push({ rowIdx, ...(await withWorld(cc, (phys) => shootPyramid(phys, aim, 1))) });
  }
  const upper = shots.filter((s) => s.rowIdx >= 3);
  row('barrelsPerHit', shots.every((s) => s.down <= 3) && upper.every((s) => s.hitRow >= 3 && s.down >= 1),
    shots.map((s) => `aim row ${s.rowIdx} (hit ${s.hitRow < 0 ? 'nothing' : 'row ' + s.hitRow}): ${s.down}`).join(', ') +
    ' of 21; expected at most 3 per hit and 1-3 on the upper three rows');

  out.innerHTML = lines.join('\n');
  document.title = allPass ? 'FOOTBALL PASS' : 'FOOTBALL FAIL';
}
main().catch((e) => { out.textContent = 'ERROR ' + e.message + '\n' + e.stack; document.title = 'FOOTBALL FAIL'; });
</script>
</body>
</html>
