<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Demolition</title>
<style>
  body { background:#1a1611; color:#f5efe4; font-family: monospace; padding: 16px; }
  pre { white-space: pre-wrap; }
  .pass { color: #6dd96d; }
  .fail { color: #e0483a; }
  .info { color: #c9a13a; }
</style>
</head>
<body>
<!-- Demolition tower harness (#86; 3×3 ground floor #99). Builds the tower on the real crashcat backend with the same
     body spec as addBlock in index.html (TSCALE 2, masonry, MASONRY_MASS_SCALE) and the same two
     collapse rules as index.html (an explosion crushes the columns within DEMO.breakRadius on the
     storey of the nearest one; a
     slab that falls and lands crushes the columns on it). A crushed column stops colliding, loses
     gravity and is parked below the ground, like crushColumn() in the game. Unlike addBlock it adds
     the centre offset ZC after scaling. Title becomes DEMOLITION PASS/FAIL.
     Charges go off on the +z face (the side facing the default camera) of each ground column,
     0.08 off the face like a stuck charge. Since #99 the ground floor has 9 columns, so the
     all-column rows use 9 charges and test the collapse, not the 6-charge limit; five-charge
     checks the limit (4 charges midway between pairs of columns, 1 on the last column).
     Measured 2026-11-27 (#99, 3×3 ground floor, DEMOLITION PASS): stable 0.0033; remote-mid /
       -low / -high: top slab 1.34 / 2.90 / 0.81 from home, 15 % of its height, 35/35 down;
       cutting 0.50; five-charge 15 %, 35/35; one-charge 100 %; six-faces 3 %; front-only 21.2.
     Measured 2026-11-26 (#86, 2×2 ground floor) during enrichment with this file (DEMOLITION PASS, 2.3 s headless):
       stable 0.0027; remote-mid / -low / -high: top slab 0.90 / 1.34 / 1.94 from home, 15 % of its
       height, 30/30 down; cutting 0.50; one-charge 100 %; front-only 4.73 (falls forward).
     And in a scratch harness with the same rules, 24 random placements per row (charge height
       15-85 % of the column, sideways up to 80 % of its half width): remote 23/24 pancakes, top
       slab 0.2-2.2 from home; cutting 23/24, 0.5-2.2. Without the two rules no geometry pancaked
       (18 geometries: it sits down one storey or tips over), and a 1.2 m blast without lift never
       freed a loaded column: friction under the load pins it. -->
<pre id="out">running…</pre>
<script type="module">
import { createCrashcatBackend } from '../../physics/backend-crashcat.js';
import { DEMO, demolitionLayout, slabHalf, columnsToCrush, slabLanded } from '../../targets/demolition.js';
import { CHARGE, CUT, BLAST_LIFT } from '../../weapons/charges.js';
import { massFor } from '../../targets/apk-layouts.js';

const out = document.getElementById('out');
const lines = [];
let allPass = true;
function row(pass, name, detail, required = true) {
  const cls = pass ? 'pass' : (required ? 'fail' : 'info');
  const tag = pass ? 'PASS' : (required ? 'FAIL' : 'INFO');
  if (!pass && required) allPass = false;
  lines.push(`<span class="${cls}">[${tag}] ${name}: ${detail}</span>`);
}

const DT = 1 / 60, S = 2, MASONRY_MASS_SCALE = 0.25, ZC = -6;
// the shipped numbers, imported so the harness follows any retune (review on #97); the cutting
// charge's sideways shove of its stuck piece is not modelled here: rule 1 crushes that column anyway
const REMOTE = { radius: CHARGE.blastRadius, strength: CHARGE.blastStrength, lift: BLAST_LIFT };
const CUTTING = { radius: CUT.radius, strength: CUT.strength, lift: CUT.lift };
let cc;

async function fresh() {
  cc ??= await import('https://esm.sh/crashcat@0.0.5');
  const phys = createCrashcatBackend(cc);
  phys.addBody({ shape: { kind: 'ground' }, mass: 0, material: 'ground', position: { x: 0, y: 0, z: 0 }, isStatic: true });
  const blocks = demolitionLayout().map(b => {
    const home = { x: b.x * S, y: b.y * S, z: b.z * S + ZC };
    return {
      ...b, home, state: {}, crushed: false,
      body: phys.addBody({
        shape: { kind: 'box', halfExtents: [b.hx * S, b.hy * S, b.hz * S] },
        mass: massFor(b) * MASONRY_MASS_SCALE, material: 'masonry', startAsleep: true,
        position: home, quaternion: { x: 0, y: 0, z: 0, w: 1 },
        linearDamping: 0.15, angularDamping: 0.3, sleepSpeedLimit: 0.3, sleepTimeLimit: 0.5,
      }),
    };
  });
  return { phys, blocks };
}

function crush(ctx, b) {
  if (b.crushed) return;
  b.crushed = true;
  ctx.phys.stopColliding(b.body);
  ctx.phys.setGravityFactor(b.body, 0);
  ctx.phys.setVelocity(b.body, 0, 0, 0);
  ctx.phys.setPosition(b.body, b.home.x, -50, b.home.z);
  for (const o of ctx.blocks) ctx.phys.wake(o.body);
}

function explodeAt(ctx, p, { radius, strength, lift }) {
  const cols = ctx.blocks.filter(b => b.part === 'column' && !b.crushed).map(b => ({ b, position: b.body.position, hy: b.hy * S, storey: b.storey }));
  for (const hit of columnsToCrush(p, cols)) crush(ctx, hit.b);
  for (const body of ctx.phys.bodies()) {
    if (body.mass <= 0) continue;
    let dx = body.position.x - p.x, dy = body.position.y - p.y, dz = body.position.z - p.z;
    const dist = Math.max(Math.hypot(dx, dy, dz), 0.5);
    if (dist > radius) continue;
    dx /= dist; dy /= dist; dz /= dist;
    const imp = strength * (1 - dist / radius);
    ctx.phys.wake(body);
    ctx.phys.applyImpulse(body, dx * imp, dy * imp + imp * lift, dz * imp);
  }
}

function step(ctx, seconds) {
  for (let f = 0; f < seconds / DT; f++) {
    ctx.phys.step(DT);
    for (const s of ctx.blocks) {
      if (s.part !== 'slab' || !slabLanded(s.state, ctx.phys.getVelocity(s.body).y)) continue;
      for (const c of ctx.blocks) if (c.part === 'column' && c.storey === s.storey + 1) crush(ctx, c);
    }
  }
}

function moved(b) {
  const p = b.body.position;
  return Math.hypot(p.x - b.home.x, p.y - b.home.y, p.z - b.home.z);
}
// how far a piece lies outside the slab footprint (negative: inside)
function beyond(b) {
  const p = b.body.position, h = slabHalf() * S;
  return Math.max(Math.abs(p.x) - h, Math.abs(p.z - ZC) - h);
}
const topSlab = (ctx) => ctx.blocks.find(b => b.part === 'slab' && b.storey === DEMO.storeys - 1);

async function checkStable() {
  const ctx = await fresh();
  for (const b of ctx.blocks) ctx.phys.wake(b.body);
  step(ctx, 10);
  const worst = Math.max(...ctx.blocks.map(moved));
  row(worst < 0.01, 'stable', `max displacement after 10 s (all woken): ${worst.toFixed(4)} (< 0.01)`);
  ctx.phys.destroy();
}

// charges on the +z face of the chosen ground columns at height fraction fy of the column
async function blast(charge, fy, which = () => true) {
  const ctx = await fresh();
  for (const c of ctx.blocks.filter(b => b.part === 'column' && b.storey === 0 && which(b))) {
    explodeAt(ctx, { x: c.home.x, y: fy * c.hy * 2 * S, z: c.home.z + c.hz * S + 0.08 }, charge);
  }
  step(ctx, 10);
  return settle(ctx);
}

function settle(ctx) {
  const top = topSlab(ctx), p = top.body.position;
  const res = {
    xz: Math.hypot(p.x - top.home.x, p.z - top.home.z),
    yFrac: p.y / top.home.y,
    slabOut: Math.max(...ctx.blocks.filter(b => b.part === 'slab').map(beyond)),
    upperOut: Math.max(...ctx.blocks.filter(b => !b.crushed && (b.part === 'slab' || b.storey >= 1)).map(beyond)),
    down: ctx.blocks.filter(b => b.crushed || moved(b) > 0.45).length,
    total: ctx.blocks.length,
  };
  ctx.phys.destroy();
  return res;
}

// Since #99 these rows set off 9 charges at once (more than the 6 a player can place), which
// pushes the stack further sideways than the 4 of #86 did: remote-low measured 2.90 in x/z.
// So the footprint (slabOut) is the measure here, and the x/z drift is only reported.
async function checkPancake(label, charge, fy) {
  const r = await blast(charge, fy);
  const pass = r.yFrac < 0.25 && r.slabOut < 0.5 && r.upperOut < 3 && r.down === r.total;
  row(pass, label, `top slab ${r.xz.toFixed(2)} from home in x/z, at ${(100 * r.yFrac).toFixed(0)} % of its height (< 25 %), slabs outside footprint ${r.slabOut.toFixed(2)} (< 0.5), upper pieces ${r.upperOut.toFixed(2)} (< 3), blocks down ${r.down}/${r.total}`);
}

async function checkOneCharge() {
  const r = await blast(REMOTE, 0.5, (b) => b.x < 0 && b.z > 0);
  row(r.yFrac > 0.95, 'one-charge', `one remote charge: top slab at ${(100 * r.yFrac).toFixed(0)} % of its height (> 95 %, the other eight columns hold it)`);
}

async function checkFrontOnly() {
  const r = await blast(REMOTE, 0.5, (b) => b.z > 0);
  row(r.xz > 2, 'front-only', `front three columns only: top slab ${r.xz.toFixed(2)} from home (it falls forward)`, false);
}

async function blastAt(charge, points) {
  const ctx = await fresh();
  for (const p of points) explodeAt(ctx, p, charge);
  step(ctx, 10);
  return settle(ctx);
}

// world positions of the 3×3 ground columns: x, z offsets in {-G, 0, G} (1.5 base × S)
const G = 1.5 * S;
async function checkFiveCharges() {
  // 4 charges on the ground midway between pairs, 1 on the +z face of the last column
  const y = 0.3;
  const pts = [
    { x: -G / 2, y, z: ZC - G },        // (-G,-G) + (0,-G)
    { x: G,      y, z: ZC - G / 2 },    // (G,-G)  + (G,0)
    { x: -G / 2, y, z: ZC },            // (-G,0)  + (0,0)
    { x: -G / 2, y, z: ZC + G },        // (-G,G)  + (0,G)
    { x: G, y: 1.2, z: ZC + G + DEMO.column / 2 * S + 0.08 },   // (G,G) alone
  ];
  const r = await blastAt(REMOTE, pts);
  const pass = r.yFrac < 0.3 && r.slabOut < 0.5 && r.down === r.total;
  row(pass, 'five-charge', `5 remote charges (4 between pairs): top slab at ${(100 * r.yFrac).toFixed(0)} % of its height (< 30 %), slabs outside footprint ${r.slabOut.toFixed(2)} (< 0.5), blocks down ${r.down}/${r.total}`);
}

async function checkSixFaces() {
  // 6 charges on 6 column faces leave the middle row (z = 0) standing
  const r = await blast(REMOTE, 0.5, (b) => b.z !== 0);
  row(r.yFrac < 0.3, 'six-faces', `6 charges on faces, 3 columns left: top slab at ${(100 * r.yFrac).toFixed(0)} % of its height`, false);
}

// a hard ball on the roof must not set off the slab-landing chain (spec anti-goal; review on #97)
async function checkRoofHit() {
  const ctx = await fresh();
  const top = topSlab(ctx);
  const ball = ctx.phys.addBody({ shape: { kind: 'sphere', radius: 0.4 }, mass: 9, material: 'ball',
    position: { x: top.home.x, y: top.home.y + 3, z: top.home.z } });
  ctx.phys.setVelocity(ball, 0, -30, 0);
  step(ctx, 6);
  const yFrac = top.body.position.y / top.home.y;
  const crushed = ctx.blocks.filter(b => b.crushed).length;
  row(yFrac > 0.95 && crushed === 0, 'roof-hit', `9 kg ball at 30 m/s on the roof: top slab at ${(100 * yFrac).toFixed(0)} % of its height, ${crushed} columns crushed (expected: stands, 0)`, false);
  ctx.phys.destroy();
}

async function main() {
  await checkStable();
  await checkPancake('remote-mid', REMOTE, 0.5);
  await checkPancake('remote-low', REMOTE, 0.25);
  await checkPancake('remote-high', REMOTE, 0.75);
  await checkPancake('cutting', CUTTING, 0.5);
  await checkFiveCharges();
  await checkOneCharge();
  await checkSixFaces();
  await checkFrontOnly();
  await checkRoofHit();
  out.innerHTML = lines.join('\n');
  document.title = allPass ? 'DEMOLITION PASS' : 'DEMOLITION FAIL';
}
main().catch(e => { out.textContent = 'ERROR ' + e.stack; document.title = 'DEMOLITION FAIL'; });
</script>
</body>
</html>
